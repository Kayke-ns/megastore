[package]
name = "megastore"
version = "1.0.0"
edition = "2021"
description = "ConectaStore: sistema de recomendação de produtos baseado em grafos"
license = "MIT"

[lib]
name = "megastore"
path = "src/lib.rs"

[[bin]]
name = "megastore"
